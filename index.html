<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王正毅 Zheng-Yi Wang｜專題與競賽成果</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      opacity: 0;
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="text-slate-700 overflow-x-clip">
  <div id="app-layout" class="flex min-h-screen">
    <div class="flex-1 min-w-0 flex flex-col relative">

      <!-- 頂部柔和光暈裝飾 -->
      <div class="pointer-events-none absolute top-0 inset-x-0 h-72 bg-gradient-to-b from-teal-50/90 via-white/70 to-transparent -z-10"></div>

      <!-- 頂部導覽列 -->
      <header class="sticky top-0 z-20 bg-white/85 backdrop-blur-md px-6 sm:px-10 pt-4 pb-3 border-b border-slate-200/80">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
          <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" aria-label="切換選單" class="p-2 -ml-2 rounded-xl text-teal-700 hover:bg-teal-50 transition-colors">
              <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <a href="index.html" class="text-sm sm:text-base font-bold text-slate-800 hover:text-teal-700 transition-colors tracking-tight">
              王正毅 Zheng-Yi Wang <span class="font-normal text-slate-400 hidden sm:inline">｜專題與競賽成果</span>
            </a>
          </div>
          <a href="https://www.zhengyiwang.com/" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium text-slate-600 bg-slate-100 hover:bg-teal-50 hover:text-teal-700 transition-colors">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i><span>主站</span>
          </a>
        </div>
      </header>

      <!-- 主要內容區 -->
      <main class="flex-1 px-6 sm:px-10 py-10 sm:py-12">
        <div class="max-w-4xl mx-auto">

          <!-- Hero 標題與介紹卡片（含個人照片） -->
          <section class="mb-10 bg-white/80 backdrop-blur-sm rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-sm">
            <div class="flex flex-col-reverse md:flex-row items-center justify-between gap-6 sm:gap-8 mb-6">
              <!-- 左側文字區 -->
              <div class="flex-1 text-center md:text-left">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-50 border border-teal-100 text-teal-700 text-xs font-semibold mb-4">
                  <span class="w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>
                  Portfolio &amp; Competition Timeline
                </div>
                <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight mb-3">
                  專題與競賽軌跡
                </h1>
                <p class="text-slate-600 text-sm sm:text-base leading-relaxed max-w-xl">
                  聚焦於水文與氣候變遷分析與雙語及地理教育。點擊時間軸上的節點，瀏覽各階段成果分頁。
                </p>
              </div>

              <!-- 右側個人照片 -->
              <div class="shrink-0">
                <img src="profile.png" alt="王正毅 Zheng-Yi Wang"
                     class="w-32 h-32 sm:w-40 sm:h-40 rounded-2xl object-cover object-top shadow-md ring-4 ring-white border border-slate-200/80" />
              </div>
            </div>

            <!-- 互動式領域篩選按鈕 -->
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 pt-4 border-t border-slate-100">
              <button onclick="setFilter('all')" data-filter="all"
                      class="filter-btn px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition-all">
                全部成果 (5)
              </button>
              <button onclick="setFilter('climate')" data-filter="climate"
                      class="filter-btn px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition-all">
                氣候與水文遙測 (4)
              </button>
              <button onclick="setFilter('edu')" data-filter="edu"
                      class="filter-btn px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition-all">
                雙語與地理教育 (1)
              </button>
            </div>
          </section>

          <!-- 多彩交錯式時間軸 -->
          <div class="relative py-2">
            <!-- 中央漸層軸線 -->
            <div class="absolute left-6 md:left-1/2 top-0 bottom-0 w-1 -translate-x-1/2 rounded-full bg-gradient-to-b from-amber-300 via-sky-300 to-rose-300 opacity-80"></div>

            <!-- 時間軸項目容器 -->
            <div id="timeline-container" class="space-y-8 md:space-y-10"></div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- 時間軸資料與渲染腳本 -->
  <script>
    const milestones = [
      {
        year: '2026',
        category: 'climate',
        date: '2026.08 – 09',
        title: '臺灣國家公園保育研討會',
        badge: '青年論文組 佳作',
        icon: 'mountain',
        url: 'np2026.html',
        nodeBg: 'bg-gradient-to-br from-amber-400 to-orange-500 ring-amber-100',
        badgeStyle: 'bg-amber-50 text-amber-700 border border-amber-200/80',
        cardHover: 'hover:border-amber-300 hover:shadow-amber-200/50',
        accentText: 'text-amber-600',
        accentBar: 'from-amber-400 to-orange-500',
        lineBg: 'bg-amber-300'
      },
      {
        year: '2026',
        category: 'edu',
        date: '2026.06',
        title: '師資生教學實務能力檢測',
        badge: '雙語教案組 第二名',
        icon: 'book-open',
        url: 'bilingual2026.html',
        nodeBg: 'bg-gradient-to-br from-emerald-400 to-teal-600 ring-emerald-100',
        badgeStyle: 'bg-emerald-50 text-emerald-700 border border-emerald-200/80',
        cardHover: 'hover:border-emerald-300 hover:shadow-emerald-200/50',
        accentText: 'text-emerald-600',
        accentBar: 'from-emerald-400 to-teal-500',
        lineBg: 'bg-emerald-300'
      },
      {
        year: '2026',
        category: 'climate',
        date: '2026.05',
        title: '教育部氣候變遷創意實作競賽｜風與綠的空間保衛戰',
        badge: '全國決賽入圍',
        icon: 'wind',
        url: 'climate2026.html',
        nodeBg: 'bg-gradient-to-br from-sky-400 to-blue-600 ring-sky-100',
        badgeStyle: 'bg-sky-50 text-sky-700 border border-sky-200/80',
        cardHover: 'hover:border-sky-300 hover:shadow-sky-200/50',
        accentText: 'text-sky-600',
        accentBar: 'from-sky-400 to-blue-500',
        lineBg: 'bg-sky-300'
      },
      {
        year: '2026',
        category: 'climate',
        date: '2026.04',
        title: '臺師大地理學相關學程小論文競賽',
        badge: '小論文競賽 優等',
        icon: 'waves',
        url: 'gis2026.html',
        nodeBg: 'bg-gradient-to-br from-purple-400 to-indigo-600 ring-purple-100',
        badgeStyle: 'bg-purple-50 text-purple-700 border border-purple-200/80',
        cardHover: 'hover:border-purple-300 hover:shadow-purple-200/50',
        accentText: 'text-purple-600',
        accentBar: 'from-purple-400 to-indigo-500',
        lineBg: 'bg-purple-300'
      },
      {
        year: '2025',
        category: 'climate',
        date: '2025',
        title: '教育部氣候變遷創意實作競賽｜熱感偵探',
        badge: '中央氣象署 氣候應用特別獎',
        icon: 'sun',
        url: 'climate2025.html',
        nodeBg: 'bg-gradient-to-br from-rose-400 to-pink-600 ring-rose-100',
        badgeStyle: 'bg-rose-50 text-rose-700 border border-rose-200/80',
        cardHover: 'hover:border-rose-300 hover:shadow-rose-200/50',
        accentText: 'text-rose-600',
        accentBar: 'from-rose-400 to-pink-500',
        lineBg: 'bg-rose-300'
      }
    ];

    let currentFilter = 'all';

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.classList.add('bg-slate-900', 'text-white', 'shadow-sm');
          btn.classList.remove('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
        } else {
          btn.classList.remove('bg-slate-900', 'text-white', 'shadow-sm');
          btn.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
        }
      });
      renderTimeline();
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      const filtered = currentFilter === 'all'
        ? milestones
        : milestones.filter(m => m.category === currentFilter);

      let lastYear = null;
      let html = '';

      filtered.forEach((item, index) => {
        // 年份分隔膠囊
        if (item.year !== lastYear) {
          lastYear = item.year;
          html += `
            <div class="relative flex items-center md:justify-center pl-14 md:pl-0 pt-2">
              <span class="relative z-10 px-4 py-1 rounded-full bg-slate-900 text-white text-xs font-bold tracking-widest shadow-sm">
                ${item.year}
              </span>
            </div>
          `;
        }

        const isLeft = index % 2 === 0;
        const delay = index * 80;

        html += `
          <div style="animation-delay: ${delay}ms;" class="animate-fade-up relative flex items-center md:justify-between group">
            
            <!-- 圓形圖示節點 -->
            <a href="${item.url}" aria-label="${item.title}"
               class="absolute left-6 md:left-1/2 -translate-x-1/2 z-10 w-12 h-12 rounded-full ${item.nodeBg} ring-8 text-white flex items-center justify-center shadow-md group-hover:scale-110 transition-transform duration-300">
              <i data-lucide="${item.icon}" class="w-5 h-5"></i>
            </a>

            <!-- 電腦版水平連接線 -->
            <div class="hidden md:block absolute top-1/2 -translate-y-1/2 h-0.5 w-8 ${item.lineBg} opacity-60 ${isLeft ? 'right-1/2 mr-6' : 'left-1/2 ml-6'}"></div>

            <!-- 電腦版日期標示（交錯於另一側） -->
            <div class="hidden md:block md:w-[43%] ${isLeft ? 'order-2 text-left pl-6' : 'order-1 text-right pr-6'}">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/90 border border-slate-200/80 text-xs font-bold ${item.accentText} shadow-xs">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                ${item.date}
              </span>
            </div>

            <!-- 內容卡片 -->
            <div class="w-full pl-16 md:pl-0 md:w-[43%] ${isLeft ? 'md:order-1' : 'md:order-2'}">
              <a href="${item.url}"
                 class="block relative overflow-hidden bg-white/95 backdrop-blur-sm rounded-2xl p-5 sm:p-6 border border-slate-200/90 shadow-sm ${item.cardHover} hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                <!-- 頂部漸層細色條 -->
                <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r ${item.accentBar}"></div>

                <div class="flex flex-wrap items-center justify-between gap-2 mb-3 pt-1">
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${item.badgeStyle}">${item.badge}</span>
                  <span class="md:hidden text-xs font-bold ${item.accentText}">${item.date}</span>
                </div>

                <h2 class="font-bold text-base sm:text-lg text-slate-900 leading-snug mb-4">
                  ${item.title}
                </h2>

                <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                  <span class="text-[11px] font-medium text-slate-400">點此查看專題分頁</span>
                  <span class="inline-flex items-center gap-1 text-xs font-semibold ${item.accentText}">
                    <span>進入分頁</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform"></i>
                  </span>
                </div>
              </a>
            </div>

          </div>
        `;
      });

      container.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => setFilter('all'));
  </script>
  <script src="menu.js"></script>
</body>
</html>
