<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王正毅 Zheng-Yi Wang｜專題與競賽成果</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-white text-slate-700 overflow-x-clip">
  <div id="app-layout" class="flex min-h-screen">
    <div class="flex-1 min-w-0 flex flex-col">

      <!-- 頂部導覽列 -->
      <header class="sticky top-0 z-20 bg-white/95 backdrop-blur-sm px-6 sm:px-10 pt-5 pb-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between pb-4 border-b-4 border-teal-600">
          <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" aria-label="切換選單" class="p-2 -ml-2 rounded-lg text-teal-700 hover:bg-teal-50 transition-colors">
              <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <a href="index.html" class="text-sm sm:text-base font-bold text-slate-800 hover:text-teal-700 transition-colors">
              王正毅 Zheng-Yi Wang <span class="font-normal text-slate-400 hidden sm:inline">｜專題與競賽成果</span>
            </a>
          </div>
          <a href="https://www.zhengyiwang.com/" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-medium text-slate-600 hover:text-teal-600 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i><span>主站</span>
          </a>
        </div>
      </header>

      <!-- 主要內容區 -->
      <main class="flex-1 px-6 sm:px-10 py-8">
        <div class="max-w-4xl mx-auto">

          <div class="mb-12">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-3">專題與競賽軌跡</h1>
            <p class="text-slate-600 text-sm sm:text-base leading-relaxed">
              聚焦於水文與氣候變遷分析與雙語及地理教育。點擊時間軸上的節點，瀏覽各階段成果分頁。
            </p>
          </div>

          <!-- 多彩交錯式時間軸 -->
          <div class="relative py-4">
            <!-- 中央漸層軸線（手機版靠左、電腦版置中） -->
            <div class="absolute left-6 md:left-1/2 top-0 bottom-0 w-1 -translate-x-1/2 rounded-full bg-gradient-to-b from-amber-300 via-sky-300 to-rose-300 opacity-70"></div>

            <!-- 時間軸項目容器 -->
            <div id="timeline-container" class="space-y-10 md:space-y-12"></div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- 時間軸資料與渲染腳本 -->
  <script>
    const milestones = [
      {
        date: '2026.08 – 09',
        title: '臺灣國家公園保育研討會',
        badge: '青年論文組 佳作',
        icon: 'mountain',
        url: 'np2026.html',
        nodeBg: 'bg-amber-500 ring-amber-100',
        badgeStyle: 'bg-amber-100 text-amber-800',
        cardHover: 'hover:border-amber-400 hover:shadow-amber-100/70',
        accentText: 'text-amber-600',
        accentBar: 'bg-amber-500'
      },
      {
        date: '2026.06',
        title: '師資生教學實務能力檢測',
        badge: '雙語教案組 第二名',
        icon: 'book-open',
        url: 'bilingual2026.html',
        nodeBg: 'bg-emerald-500 ring-emerald-100',
        badgeStyle: 'bg-emerald-100 text-emerald-800',
        cardHover: 'hover:border-emerald-400 hover:shadow-emerald-100/70',
        accentText: 'text-emerald-600',
        accentBar: 'bg-emerald-500'
      },
      {
        date: '2026.05',
        title: '教育部氣候變遷創意實作競賽｜風與綠的空間保衛戰',
        badge: '全國決賽入圍',
        icon: 'wind',
        url: 'climate2026.html',
        nodeBg: 'bg-sky-500 ring-sky-100',
        badgeStyle: 'bg-sky-100 text-sky-800',
        cardHover: 'hover:border-sky-400 hover:shadow-sky-100/70',
        accentText: 'text-sky-600',
        accentBar: 'bg-sky-500'
      },
      {
        date: '2026.04',
        title: '臺師大地理學相關學程小論文競賽',
        badge: '小論文競賽 優等',
        icon: 'waves',
        url: 'gis2026.html',
        nodeBg: 'bg-purple-500 ring-purple-100',
        badgeStyle: 'bg-purple-100 text-purple-800',
        cardHover: 'hover:border-purple-400 hover:shadow-purple-100/70',
        accentText: 'text-purple-600',
        accentBar: 'bg-purple-500'
      },
      {
        date: '2025',
        title: '教育部氣候變遷創意實作競賽｜熱感偵探',
        badge: '中央氣象署 氣候應用特別獎',
        icon: 'sun',
        url: 'climate2025.html',
        nodeBg: 'bg-rose-500 ring-rose-100',
        badgeStyle: 'bg-rose-100 text-rose-800',
        cardHover: 'hover:border-rose-400 hover:shadow-rose-100/70',
        accentText: 'text-rose-600',
        accentBar: 'bg-rose-500'
      }
    ];

    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      container.innerHTML = milestones.map((item, index) => {
        const isLeft = index % 2 === 0;
        return `
          <div class="relative flex items-center md:justify-between group">
            
            <!-- 圓形圖示節點（手機靠左、電腦置中） -->
            <a href="${item.url}" aria-label="${item.title}"
               class="absolute left-6 md:left-1/2 -translate-x-1/2 z-10 w-12 h-12 rounded-full ${item.nodeBg} ring-8 text-white flex items-center justify-center shadow-md group-hover:scale-110 transition-transform duration-200">
              <i data-lucide="${item.icon}" class="w-5 h-5"></i>
            </a>

            <!-- 電腦版空白佔位（用來做出左右交錯效果） -->
            <div class="hidden md:block md:w-[44%] ${isLeft ? 'order-2 text-left pl-4' : 'order-1 text-right pr-4'}">
              <span class="inline-block text-sm font-bold ${item.accentText} tracking-wide">${item.date}</span>
            </div>

            <!-- 內容卡片 -->
            <div class="w-full pl-16 md:pl-0 md:w-[44%] ${isLeft ? 'md:order-1' : 'md:order-2'}">
              <a href="${item.url}"
                 class="block relative overflow-hidden bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm ${item.cardHover} hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
                <!-- 頂部細色條 -->
                <div class="absolute top-0 left-0 right-0 h-1 ${item.accentBar}"></div>

                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${item.badgeStyle}">${item.badge}</span>
                  <span class="md:hidden text-xs font-bold ${item.accentText}">${item.date}</span>
                </div>

                <h2 class="font-bold text-base sm:text-lg text-slate-900 leading-snug mb-3">
                  ${item.title}
                </h2>

                <div class="inline-flex items-center gap-1 text-xs font-semibold ${item.accentText}">
                  <span>進入分頁</span>
                  <i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform"></i>
                </div>
              </a>
            </div>

          </div>
        `;
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', renderTimeline);
  </script>
  <script src="menu.js"></script>
</body>
</html>
